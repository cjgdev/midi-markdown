name: Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v0.1.0, v1.2.3, etc.

permissions:
  contents: write       # Required for creating releases
  id-token: write      # Required for artifact attestation
  attestations: write  # Required for artifact attestation

jobs:
  test:
    name: Run tests before release
    uses: ./.github/workflows/test.yml

  build-executables:
    needs: test
    uses: ./.github/workflows/build-executables.yml

  smoke-test:
    name: Smoke test executables
    needs: build-executables
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact_name: mmdc-linux-x86_64
            archive: mmdc-linux-x86_64.tar.gz
            executable: mmdc/mmdc
          - os: macos-latest
            platform: macos
            artifact_name: mmdc-macos-universal
            archive: mmdc-macos-universal.zip
            executable: mmdc/mmdc
          - os: windows-latest
            platform: windows
            artifact_name: mmdc-windows-x86_64
            archive: mmdc-windows-x86_64.zip
            executable: mmdc/mmdc.exe
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts

      - name: Extract executable (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p test-dir
          cd test-dir
          if [[ "${{ matrix.archive }}" == *.tar.gz ]]; then
            tar -xzf ../artifacts/${{ matrix.archive }}
          else
            unzip -q ../artifacts/${{ matrix.archive }}
          fi
          chmod +x ${{ matrix.executable }}

      - name: Extract executable (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path test-dir
          Expand-Archive -Path "artifacts\${{ matrix.archive }}" -DestinationPath test-dir

      - name: Test version command (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "🧪 Testing ${{ matrix.platform }} executable..."
          test-dir/${{ matrix.executable }} --version

      - name: Test version command (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Write-Host "🧪 Testing ${{ matrix.platform }} executable..."
          & "test-dir\${{ matrix.executable }}" --version

      - name: Test compile command (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          OUTPUT_FILE="${{ runner.temp }}/test-${{ matrix.platform }}.mid"
          test-dir/${{ matrix.executable }} compile examples/00_basics/01_hello_world.mmd -o "$OUTPUT_FILE"
          if [ ! -f "$OUTPUT_FILE" ]; then
            echo "❌ Output file not created"
            exit 1
          fi
          echo "✅ ${{ matrix.platform }} executable smoke test passed"

      - name: Test compile command (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $OutputFile = "${{ runner.temp }}\test-${{ matrix.platform }}.mid"
          & "test-dir\${{ matrix.executable }}" compile examples/00_basics/01_hello_world.mmd -o $OutputFile
          if (-not (Test-Path $OutputFile)) {
            Write-Host "❌ Output file not created"
            exit 1
          }
          Write-Host "✅ ${{ matrix.platform }} executable smoke test passed"

  create-release:
    name: Create GitHub Release
    needs: smoke-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Move artifacts to release directory
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.sha256" \) -exec mv {} release/ \;
          ls -lh release/

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'release/*.tar.gz,release/*.zip'

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Package Claude Skills
        run: |
          python scripts/package_claude_skills.py \
            --source . \
            --output release \
            --version ${{ steps.get_version.outputs.VERSION }}

      - name: Verify Claude Skills package
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          # Check both tar.gz and zip were created
          if [ ! -f "release/claude-skills-mmd-${VERSION}.tar.gz" ]; then
            echo "❌ Claude Skills tar.gz not found"
            exit 1
          fi
          if [ ! -f "release/claude-skills-mmd-${VERSION}.zip" ]; then
            echo "❌ Claude Skills zip not found"
            exit 1
          fi
          # Verify archives are not empty
          TAR_SIZE=$(stat -f%z "release/claude-skills-mmd-${VERSION}.tar.gz" 2>/dev/null || stat -c%s "release/claude-skills-mmd-${VERSION}.tar.gz")
          ZIP_SIZE=$(stat -f%z "release/claude-skills-mmd-${VERSION}.zip" 2>/dev/null || stat -c%s "release/claude-skills-mmd-${VERSION}.zip")
          if [ "$TAR_SIZE" -lt 1000 ]; then
            echo "❌ Claude Skills tar.gz too small: ${TAR_SIZE} bytes"
            exit 1
          fi
          if [ "$ZIP_SIZE" -lt 1000 ]; then
            echo "❌ Claude Skills zip too small: ${ZIP_SIZE} bytes"
            exit 1
          fi
          echo "✅ Claude Skills packages verified:"
          ls -lh release/claude-skills-mmd-*

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          # Extract changelog section using Python script (more robust than sed)
          python scripts/extract_changelog.py --version "$VERSION" --output /tmp/release_notes.md
          # Read and set output
          CHANGELOG_SECTION=$(cat /tmp/release_notes.md)
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG_SECTION" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          body: |
            ## MIDI Markdown Compiler ${{ github.ref_name }}

            ### What's New

            ${{ steps.changelog.outputs.CHANGELOG }}

            ### Installation

            #### MMDC Compiler

            **Download standalone executables** (no Python required):

            - **Linux**: `mmdc-linux-x86_64.tar.gz`
            - **Windows**: `mmdc-windows-x86_64.zip`
            - **macOS**: `mmdc-macos-universal.zip`

            Extract the archive and run the `mmdc` executable.

            **Verify checksums** using the `.sha256` files to ensure download integrity.

            #### Claude Code Skills (Optional)

            **For Claude Code users**, download the skills package for enhanced MMD development:

            - **All platforms**: `claude-skills-mmd-${{ steps.get_version.outputs.VERSION }}.tar.gz` or `.zip`

            The skills package includes:
            - **mmd-writing** - Help writing MMD files with correct syntax
            - **mmdc-cli-usage** - Help using the mmdc CLI effectively

            See [Claude Skills documentation](https://cjgdev.github.io/midi-markdown/getting-started/claude-skills/) for installation instructions.

            ### Installation via pip/pipx (Python users)

            ```bash
            # Using pipx (recommended - isolated environment)
            pipx install midi-markdown==${{ steps.get_version.outputs.VERSION }}

            # Or using pip
            pip install midi-markdown==${{ steps.get_version.outputs.VERSION }}
            ```

            ### Platform-Specific Notes

            **Windows Security Warning**: Windows SmartScreen may show a warning for unsigned executables. Click "More info" then "Run anyway" to proceed. This is normal for open-source software without expensive code signing certificates.

            **macOS Gatekeeper**: macOS may block the executable. Right-click the app and select "Open" to bypass Gatekeeper, or run:
            ```bash
            xattr -cr mmdc
            ```

            ### Quick Start

            ```bash
            # Check installation
            mmdc --version

            # Compile your first MML file
            mmdc compile song.mmd -o song.mid

            # Play back in real-time (requires MIDI device)
            mmdc play song.mmd --port 0

            # See all commands
            mmdc --help
            ```

            ### Documentation

            - **User Guide**: https://github.com/cjgdev/midi-markdown#readme
            - **Examples**: https://github.com/cjgdev/midi-markdown/tree/main/examples
            - **Language Spec**: https://github.com/cjgdev/midi-markdown/blob/main/spec.md

            ### Full Changelog

            See below for complete changelog generated by GitHub.

          files: |
            release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-pypi:
    name: Publish to PyPI
    needs: create-release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/midi-markdown
    permissions:
      id-token: write  # Required for Trusted Publishing
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install build dependencies
        run: uv sync

      - name: Verify version consistency
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          uv pip install tomli
          PKG_VERSION=$(uv run python -c "import tomli; print(tomli.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "❌ Version mismatch: tag=$TAG_VERSION, package=$PKG_VERSION"
            echo "Please update pyproject.toml version to match the git tag"
            exit 1
          fi
          echo "✅ Version consistency verified: $TAG_VERSION"

      - name: Build distributions
        run: uv build

      - name: Display built distributions
        run: |
          ls -lh dist/
          echo "=== Package contents ==="
          tar -tzf dist/*.tar.gz | head -20

      - name: Check distributions
        run: |
          uv tool install twine
          uv tool run twine check dist/*

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
          verbose: true

      - name: Verify PyPI upload
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "✅ Published midi-markdown $VERSION to PyPI"
          echo "📦 View at: https://pypi.org/project/midi-markdown/$VERSION/"
          echo ""
          echo "Install with:"
          echo "  pip install midi-markdown==$VERSION"
          echo "  pipx install midi-markdown==$VERSION"
